syntax = "proto3";

package grpc;
option go_package = "gitlab.com/f_mancini/distribuitedOrderedMulticast/pkg/registry/grpc";

service Registry {
  rpc register (RegistrationInfo) returns (GroupInfo) {}
  rpc getStatus (Group) returns (GroupInfo) {}
  rpc startGroup (Group) returns (GroupInfo) {}

}

enum Status {
  STARTING = 0;
  ACTIVE = 1;
  CLOSED = 2;
}

enum MulticastType {
  BMULTICAST = 0;
  FIFOMULTICAST = 1;
  TOMULTICASTSEQ = 2;
  TOMULTICASTSC = 3;
  COMULTICAST = 4;
  TOCOMULTICAST = 5;
}

message RegistrationInfo {
  string groupId = 1;
  MulticastType multicastType = 2;
  uint32 clientPort = 3;

}

message GroupInfo {
  string groupId = 1;
  MulticastType multicastType = 2;
  Status status = 3;
  map<string, MemberInfo>  members = 4;
}

message Group {
  string groupId = 1;
}

message MemberInfo {
  string id = 1;
  string address = 2;
}






