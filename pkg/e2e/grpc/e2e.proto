syntax = "proto3";

package grpc;
option go_package = "gitlab.com/f_mancini/distribuitedOrderedMulticast/pkg/e2e/grpc";

service E2e {
  rpc send (Message) returns (Empty) {}
}

// The request message containing the user's name.
message Message {
  string id = 1;
  map<string, string> metadata = 2;
  bytes payload = 3;

}
// The response message containing the greetings
message Empty {
}